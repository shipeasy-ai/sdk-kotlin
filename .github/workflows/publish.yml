name: Publish

# HARD RULE: never publish manually. Bump the `version` in build.gradle.kts,
# push to main, and this workflow handles Maven Central via the Central Portal.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - run: gradle test

      - name: Read package version
        id: ver
        run: |
          VER=$(gradle -q properties | awk '/^version:/ {print $2}')
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Check if version already on Maven Central
        id: check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://repo1.maven.org/maven2/ai/shipeasy/shipeasy-kotlin/${{ steps.ver.outputs.version }}/shipeasy-kotlin-${{ steps.ver.outputs.version }}.pom")
          if [ "$STATUS" = "200" ]; then
            echo "Already published: ai.shipeasy:shipeasy-kotlin:${{ steps.ver.outputs.version }}"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Maven Central
        if: steps.check.outputs.skip != '1'
        env:
          # The vanniktech maven-publish plugin reads these property names.
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_signingInMemoryKey" ] || [ -z "$ORG_GRADLE_PROJECT_mavenCentralUsername" ]; then
            echo "::warning::Maven Central credentials not configured — skipping publish. Required secrets: GPG_PRIVATE_KEY, GPG_PASSPHRASE, CENTRAL_USERNAME, CENTRAL_PASSWORD."
            exit 0
          fi
          gradle publishAndReleaseToMavenCentral --no-configuration-cache
