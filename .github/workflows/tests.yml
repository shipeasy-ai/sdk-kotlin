name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The Kotlin Gradle build pins `jvmToolchain(11)`, so the runner provides
      # JDK 11 (Gradle 8.7 runs on it and uses it as the toolchain).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Test
        run: gradle test

  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: README + embedded skill are generated from docs/ — check they're in sync
        run: |
          java tools/GenReadme.java
          git diff --exit-code README.md src/main/resources/shipeasy-skill/SKILL.md \
            || { echo "::error::README.md or the embedded skill is out of date — run 'java tools/GenReadme.java' and commit."; exit 1; }
